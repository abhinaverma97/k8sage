apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8sage
resources:
  - ../../base
patches:
  - target:
      kind: Service
      name: gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
  - target:
      kind: Deployment
      name: evidence
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  - target:
      kind: Deployment
      name: sage
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
# Image tags are injected by the deploy pipeline (kustomize edit set image)
# with immutable build-sha tags — see .github/workflows/cd.yml.
images:
  - name: ghcr.io/abhinaverma97/k8sage-evidence
    newTag: v0.1.0
  - name: ghcr.io/abhinaverma97/k8sage-sage
    newTag: v0.1.0
  - name: ghcr.io/abhinaverma97/k8sage-gateway
    newTag: v0.1.0
  - name: ghcr.io/abhinaverma97/k8sage-frontend
    newTag: v0.1.0
