# Stateful workload: chat history survives pod restarts.
# Uses k3s's built-in local-path StorageClass (single node, demo-grade:
# no HA, data lives on the node — back up with pg_dump).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: k8sage
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: k8sage
            - name: POSTGRES_DB
              value: k8sage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8sage-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "k8sage", "-d", "k8sage"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "k8sage", "-d", "k8sage"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: k8sage
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
