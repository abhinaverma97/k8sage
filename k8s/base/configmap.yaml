# Non-secret environment shared by all services.
# Secrets (GROQ_API_KEY, POSTGRES_PASSWORD, DATABASE_URL) live in the
# `k8sage-secrets` Secret, created by the deploy pipeline (see docs/deploy.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8sage-config
  namespace: k8sage
data:
  OBSERVED_NAMESPACE: "default"
  GROQ_MODEL: "gpt-oss-120b"
  EVIDENCE_URL: "http://evidence.k8sage.svc.cluster.local:8082"
  SAGE_URL: "http://sage.k8sage.svc.cluster.local:8081"
