name: terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply (requires OCI secrets)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      # validate needs no OCI credentials — runs on every PR
      - run: terraform validate

  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan' && secrets.OCI_TENANCY_OCID != ''
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      - run: terraform plan -out=tfplan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: /tmp/oci_key.pem
      - name: Write OCI key
        run: echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
        shell: bash
        env:
          TF_VAR_region: ${{ secrets.OCI_REGION }}

  apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && secrets.OCI_TENANCY_OCID != ''
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Write OCI key
        run: echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key.pem
        shell: bash
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      - run: terraform apply -auto-approve
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: /tmp/oci_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}