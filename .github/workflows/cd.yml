name: cd

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "k8s/**"
      - ".github/workflows/cd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_ROOT: ghcr.io/abhinaverma97
  NEXT_PUBLIC_GATEWAY_URL: https://sage.itsabhi.in

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, sage, evidence, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      # ARM runner => native arm64 build (the cluster is ARM). For amd64,
      # add platforms: linux/amd64 and a qemu setup step.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            PACKAGE=@k8sage/${{ matrix.service }}
            NEXT_PUBLIC_GATEWAY_URL=${{ env.NEXT_PUBLIC_GATEWAY_URL }}
          tags: |
            ${{ env.IMAGE_ROOT }}/k8sage-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.IMAGE_ROOT }}/k8sage-${{ matrix.service }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      IMAGE_SHA: sha-${{ github.sha }}
    steps:
      - name: Deploy to cluster via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30m
          envs: POSTGRES_PASSWORD,GROQ_API_KEY,IMAGE_SHA,NEXT_PUBLIC_GATEWAY_URL
          script: |
            set -euo pipefail

            # 1. Install k3s on first run. Caddy owns 80/443 on this box, so
            #    the bundled Traefik + ServiceLB are disabled.
            if [ ! -f /etc/rancher/k3s/k3s.yaml ]; then
              echo "[deploy] installing k3s..."
              curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --disable servicelb" sh -
            fi

            for i in $(seq 1 30); do
              sudo kubectl get nodes >/dev/null 2>&1 && break || sleep 2
            done

            # 2. Clone / pull the repo
            if [ -d /opt/k8sage ]; then
              cd /opt/k8sage && sudo git pull origin main
            else
              sudo git clone https://github.com/abhinaverma97/k8sage.git /opt/k8sage
              sudo chown -R "$(whoami):$(whoami)" /opt/k8sage
              cd /opt/k8sage
            fi

            # 3. Namespace + secrets (idempotent)
            sudo kubectl create namespace k8sage --dry-run=client -o yaml | sudo kubectl apply -f -
            DATABASE_URL="postgresql://k8sage:${POSTGRES_PASSWORD}@postgres.k8sage.svc.cluster.local:5432/k8sage"
            sudo kubectl -n k8sage create secret generic k8sage-secrets \
              --from-literal=GROQ_API_KEY="${GROQ_API_KEY}" \
              --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              --from-literal=DATABASE_URL="${DATABASE_URL}" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # 4. Pin immutable image tags, then render + apply
            command -v kustomize >/dev/null 2>&1 || sudo curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
            cd /opt/k8sage/k8s/overlays/prod
            for svc in gateway sage evidence frontend; do
              sudo kustomize edit set image ghcr.io/abhinaverma97/k8sage-${svc}:v0.1.0=ghcr.io/abhinaverma97/k8sage-${svc}:${IMAGE_SHA}
            done
            sudo kubectl apply -k /opt/k8sage/k8s/overlays/prod

            # 5. Wait for rollouts
            for d in evidence sage gateway frontend; do
              sudo kubectl -n k8sage rollout status deployment/${d} --timeout=180s
            done
            sudo kubectl -n k8sage rollout status statefulset/postgres --timeout=180s

            # 6. Health checks through NodePorts
            for i in $(seq 1 30); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:30080/health)" = "200" ] && break || sleep 2
            done
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:30080/health)" = "200" ] && echo "[deploy] gateway healthy" || { echo "[deploy] gateway NOT healthy"; exit 1; }
            curl -s -o /dev/null -w 'frontend http_code=%{http_code}\n' http://127.0.0.1:30081/

            echo "[deploy] done at $(date)"